<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Calculator</title>
  <style>
    :root {
      --bg: #1d1130;
      --calc-bg: #2a1b4a;
      --display-bg: #160c2b;
      --btn: #3d2a66;
      --btn-hover: #4c3580;
      --op-btn: #6d4aff;
      --op-hover: #7f5fff;
      --eq-btn: #a58bff;
      --eq-hover: #b69dff;
      --text: #ffffff;
      --muted: #9d8fc7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .calculator {
      background: var(--calc-bg);
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 340px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    .display {
      background: var(--display-bg);
      border-radius: 12px;
      padding: 14px 18px;
      margin-bottom: 18px;
      text-align: right;
      overflow-x: auto;
      white-space: nowrap;
    }

    .expression {
      font-size: 1rem;
      color: var(--muted);
      min-height: 1.4em;
    }

    .result {
      font-size: 2.2rem;
      font-weight: 600;
      margin-top: 4px;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 16px 0;
      font-size: 1.25rem;
      font-weight: 600;
      cursor: pointer;
      background: var(--btn);
      color: var(--text);
      transition: background 0.15s, transform 0.05s;
    }

    button:hover {
      background: var(--btn-hover);
    }

    button:active {
      transform: scale(0.96);
    }

    .operator {
      background: var(--op-btn);
    }

    .operator:hover {
      background: var(--op-hover);
    }

    .equals {
      background: var(--eq-btn);
      color: #1d1130;
      grid-column: span 2;
    }

    .equals:hover {
      background: var(--eq-hover);
    }

    .clear {
      color: #ff8a80;
      font-weight: 700;
    }

    .roman {
      background: var(--op-btn);
      font-size: 1rem;
    }

    .roman:hover {
      background: var(--op-hover);
    }

    .hint {
      margin-top: 14px;
      font-size: 0.78rem;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="calculator">
    <div class="display">
      <div class="expression" data-role="expression">&nbsp;</div>
      <div class="result" data-role="result">0</div>
    </div>
    <div id="calculator">
      <div class="buttons" id="decimal_calculator" style="display: grid;">
        <button class="clear" data-action="clear">C</button>
        <button data-action="paren">( )</button>
        <button data-action="back">&#9003;</button>
        <button class="operator" data-insert="/">&divide;</button>

        <button data-insert="7">7</button>
        <button data-insert="8">8</button>
        <button data-insert="9">9</button>
        <button class="operator" data-insert="*">&times;</button>

        <button data-insert="4">4</button>
        <button data-insert="5">5</button>
        <button data-insert="6">6</button>
        <button class="operator" data-insert="-">&minus;</button>

        <button data-insert="1">1</button>
        <button data-insert="2">2</button>
        <button data-insert="3">3</button>
        <button class="operator" data-insert="+">+</button>

        <button data-insert="0" style="grid-column: span 2;">0</button>
        <button data-insert=".">.</button>
        <button class="equals" data-action="equals">=</button>
        <button onclick="toggleToRoma()" class="roman" data-action="equals">Roman</button>
      </div>
    </div>
    <!-- <div class="hint">Keyboard supported: digits, + &minus; &times; &divide;, ( ), Enter, Backspace, Esc</div> -->
    <div id="roman_calculator">
      <div class="buttons" id="roman_number_calculator" style="display: none;">
        <button class="clear" data-action="clear">C</button>
        <button data-action="paren">( )</button>
        <button data-action="back">&#9003;</button>
        <button class="operator" data-insert="/">&divide;</button>

        <button data-insert="M">M</button>
        <button data-insert="D">D</button>
        <button data-insert="C">C</button>
        <button class="operator" data-insert="*">&times;</button>

        <button data-insert="L">L</button>
        <button data-insert="X">X</button>
        <button data-insert="V">V</button>
        <button class="operator" data-insert="-">&minus;</button>

        <button data-insert="I">I</button>
        <button data-insert="(">(</button>
        <button data-insert=")">)</button>
        <button class="operator" data-insert="+">+</button>

        <button class="equals" data-action="equals">=</button>
        <button onclick="toggleToDecimal()" class="roman" data-action="equals">Decimal</button>
      </div>
    </div>
  </div>
  <!-- <div class="hint">Keyboard supported: digits, + &minus; &times; &divide;, ( ), Enter, Backspace, Esc</div> -->

  <script>
    function toggleToRoma() {
      document.getElementById('decimal_calculator').style.display = 'none';
      document.getElementById('roman_number_calculator').style.display = 'grid';
    }

    function toggleToDecimal() {
      document.getElementById('roman_number_calculator').style.display = 'none';
      document.getElementById('decimal_calculator').style.display = 'grid';
    }
  </script>
  <!-- IIFE for Decimal Calculator -->
  <script>
    (function () {
      const panel = document.getElementById('decimal_calculator');
      if (!panel) return;                         // div not present → do nothing

      const display = document.querySelector('.display');
      const exprEl = display.querySelector('[data-role="expression"]');
      const resultEl = display.querySelector('[data-role="result"]');
      const OPERATORS = '+*/';

      let expr = '';

      function round(value) {
        return String(Math.round(value * 1e10) / 1e10);
      }

      // Validate: only digits, operators, parens and dots; parens must balance.
      function isValidExpression(str) {
        if (!/^[0-9+\-*/().\s]*$/.test(str)) return false;
        let depth = 0;
        for (const ch of str) {
          if (ch === '(') depth++;
          if (ch === ')') depth--;
          if (depth < 0) return false;
        }
        return depth === 0;
      }

      function safeEval(str) {
        if (!isValidExpression(str)) throw new Error('invalid');
        // Input is strictly filtered by the regex above, so only numbers,
        // operators, parentheses and dots can reach this evaluation.
        const value = Function('"use strict"; return (' + str + ')')();
        if (typeof value !== 'number' || !isFinite(value)) throw new Error('undefined');
        return value;
      }

      // Decide whether opening or closing paren makes sense right now.
      function smartParen() {
        const opens = (expr.match(/\(/g) || []).length;
        const closes = (expr.match(/\)/g) || []).length;
        if (/[0-9)]$/.test(expr) && opens > closes) {
          expr += ')';
        } else {
          expr += '(';
        }
      }

      function updatePreview() {
        exprEl.textContent = expr || '\u00A0';
        if (!expr) { resultEl.textContent = '0'; return; }
        try {
          resultEl.textContent = round(safeEval(expr));
        } catch (e) {
          // Keep showing the previous preview; '=' will report the problem.
        }
      }

      function insert(text) {
        const lastCh = expr.slice(-1);
        if (OPERATORS.includes(text)) {
          if (OPERATORS.includes(lastCh)) {
            expr = expr.slice(0, -1) + text;       // replace previous operator
          } else if (!expr && text !== '-') {
            return;                                 // no leading + * /
          }
          expr += text;
        } else {
          expr += text;
        }
        updatePreview();
      }

      function backspace() {
        expr = expr.slice(0, -1);
        updatePreview();
      }

      function clearAll() {
        expr = '';
        exprEl.textContent = '\u00A0';
        resultEl.textContent = '0';
      }

      function evaluate() {
        if (!expr.trim()) return;
        try {
          const value = round(safeEval(expr));
          exprEl.textContent = expr + ' =';
          resultEl.textContent = value;
          expr = value;                       // continue calculating from result
        } catch (e) {
          resultEl.textContent = 'Invalid';
        }
      }

      // CHANGED: scope buttons to this calculator's panel only.
      panel.querySelectorAll('button').forEach(function (btn) {
        btn.addEventListener('click', function () {
          if (btn.dataset.action === 'clear') clearAll();
          else if (btn.dataset.action === 'back') backspace();
          else if (btn.dataset.action === 'paren') { smartParen(); updatePreview(); }
          else if (btn.dataset.action === 'equals') evaluate();
          else if (btn.dataset.insert) insert(btn.dataset.insert);
        });
      });

      // CHANGED: guard keystrokes — ignore when this panel is hidden,
      // and don't hijack typing when focus is in an editable element.
      function visible() { return panel.offsetParent !== null; }

      document.addEventListener('keydown', function (e) {
        if (!visible()) return;
        const t = e.target;
        if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
        const k = e.key;
        if (/^[0-9.]$/.test(k)) insert(k);
        else if (['+', '-', '*', '/'].includes(k)) insert(k);
        else if (k === '(' || k === ')') { smartParen(); updatePreview(); }
        else if (k === 'Enter' || k === '=') { e.preventDefault(); evaluate(); }
        else if (k === 'Backspace') backspace();
        else if (k === 'Escape') clearAll();
      });
    })();
  </script>
  <!-- IIFE for Roman Calculator -->
  <script>
    (function () {
      const panel = document.getElementById('roman_number_calculator');
      if (!panel) return;

      const display = document.querySelector('.display');
      const exprEl = display.querySelector('[data-role="expression"]');
      const resultEl = display.querySelector('[data-role="result"]');

      // CHANGED: no operators — Roman digits and their values instead.
      const ROMAN_VALUES = { I: 1, V: 5, X: 10, L: 50, C: 100, D: 500, M: 1000 };
      const VALID_ROMAN =
        /^M{0,3}(CM|CD|D?C{0,3})(XC|XL|L?X{0,3})(IX|IV|V?I{0,3})$/;

      let expr = '';

      // CHANGED: validity = non-empty and matches the canonical grammar.
      function isValid(str) {
        return str.length > 0 && VALID_ROMAN.test(str);
      }

      // fromRoman from earlier (strict parsing happens via isValid first).
      function fromRoman(s) {
        let total = 0;
        for (let i = s.length - 1; i >= 0; i--) {
          const curr = ROMAN_VALUES[s[i]];
          const next = i + 1 < s.length ? ROMAN_VALUES[s[i + 1]] : 0;
          total += curr < next ? -curr : curr;
        }
        return total;
      }

      // NEW: toRoman (greedy with the 13-token table) — used to normalize
      // after '=', so continuing from a result starts from canonical form.
      const TOKENS = [
        [1000, 'M'], [900, 'CM'], [500, 'D'], [400, 'CD'],
        [100, 'C'], [90, 'XC'], [50, 'L'], [40, 'XL'],
        [10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV'], [1, 'I']
      ];
      function toRoman(n) {
        let result = '';
        for (const [value, symbol] of TOKENS) {
          while (n >= value) { result += symbol; n -= value; }
        }
        return result;
      }

      // CHANGED: the preview now shows the decimal equivalent of what
      // you've typed — 'Invalid' while the string doesn't parse yet.
      function updatePreview() {
        exprEl.textContent = expr || '\u00A0';
        if (!expr) { resultEl.textContent = ''; return; }
        const upper = expr.toUpperCase();
        resultEl.textContent = isValid(upper) ? String(fromRoman(upper)) : 'Invalid';
      }

      // CHANGED: insert accepts one Roman letter at a time; anything else
      // (operators, digits) is ignored rather than appended.
      function insert(text) {
        const ch = text.toUpperCase();
        if (!/^[MDCLXVI]$/.test(ch)) return;
        expr += ch;
        updatePreview();
      }

      // UNCHANGED from the decimal version.
      function backspace() {
        expr = expr.slice(0, -1);
        updatePreview();
      }

      function clearAll() {
        expr = '';
        exprEl.textContent = '\u00A0';
        resultEl.textContent = '';
      }

      // CHANGED: '=' validates, converts, then stores the canonical numeral
      // as the new expr (mirrors the decimal calc continuing from its result).
      function evaluate() {
        if (!expr.trim()) return;
        const upper = expr.toUpperCase();
        if (!isValid(upper)) { resultEl.textContent = 'Invalid'; return; }
        const value = fromRoman(upper);
        exprEl.textContent = upper + ' =';
        resultEl.textContent = String(value);
        expr = toRoman(value);
      }

      // SAME SCOPING as decimal: only this panel's buttons.
      panel.querySelectorAll('button').forEach(function (btn) {
        btn.addEventListener('click', function () {
          if (btn.dataset.action === 'clear') clearAll();
          else if (btn.dataset.action === 'back') backspace();
          else if (btn.dataset.action === 'equals') evaluate();
          else if (btn.dataset.insert) insert(btn.dataset.insert);
        });
      });

      // SAME GUARD as decimal, with a Roman-only key filter.
      function visible() { return panel.offsetParent !== null; }

      document.addEventListener('keydown', function (e) {
        if (!visible()) return;
        const t = e.target;
        if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
        const k = e.key.toUpperCase();
        if (/^[MDCLXVI]$/.test(k)) insert(k);
        else if (k === 'Enter' || k === '=') { e.preventDefault(); evaluate(); }
        else if (k === 'Backspace') backspace();
        else if (k === 'Escape') clearAll();
      });
    })();
  </script>

  <!-- Roman to Decimal and Decimal to Roman Functions -->
  <script>
    const ROMAN_VALUES = { I: 1, V: 5, X: 10, L: 50, C: 100, D: 500, M: 1000 };

    const VALID_ROMAN =
      /^M{0,3}(CM|CD|D?C{0,3})(XC|XL|L?X{0,3})(IX|IV|V?I{0,3})$/;

    function fromRoman(s) {
      if (typeof s !== "string" || !VALID_ROMAN.test(s.toUpperCase().trim())) {
        throw new RangeError(`Invalid Roman numeral: "${s}"`);
      }
      s = s.toUpperCase().trim();
      let total = 0;
      for (let i = s.length - 1; i >= 0; i--) {
        const curr = ROMAN_VALUES[s[i]];
        const next = i + 1 < s.length ? ROMAN_VALUES[s[i + 1]] : 0;
        total += curr < next ? -curr : curr;
      }
      return total;
    }

    console.log(fromRoman("MCM"));     // 1900
    console.log(fromRoman("MCMXCIV")); // 1994
    console.log(fromRoman("DC"));      // 600
    console.log(fromRoman("mmxxvi"));  // 2026 (case-insensitive, trimmed)

    // console.log(fromRoman("IIII"));    // RangeError: Invalid Roman numeral: "IIII"
    // console.log(fromRoman("IC"));      // RangeError: Invalid Roman numeral: "IC"
    // console.log(fromRoman(""));        // RangeError: Invalid Roman numeral: ""

  </script>
  <script>
    const VALUES = [
      [1000, "M"], [900, "CM"], [500, "D"], [400, "CD"],
      [100, "C"], [90, "XC"], [50, "L"], [40, "XL"],
      [10, "X"], [9, "IX"], [5, "V"], [4, "IV"],
      [1, "I"]
    ];

    function toRoman(n) {
      let result = "";
      for (const [value, symbol] of VALUES) {
        while (n >= value) {
          result += symbol;
          n -= value;
        }
      }
      return result;
    }

    console.log(toRoman(1900)); // "MCM"
    console.log(toRoman(600));  // "DC"
    console.log(toRoman(1994)); // "MCMXCIV"
  </script>
</body>

</html>
